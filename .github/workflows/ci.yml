name: Core and ABI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/trajectory.mjs
      - run: node --check viewer/app.js
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --release
      - name: Build and test portable viewer (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-viewer.ps1
          python tests/viewer_smoke.py TerraMol.exe
          python scripts/package-viewer.py
      - name: Build and test local viewer (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cargo build --release --features viewer --bin terramol_viewer
          python tests/viewer_smoke.py target/release/terramol_viewer
      - name: DLL ABI smoke (Windows)
        if: runner.os == 'Windows'
        run: |
          python tests/dll_smoke.py target/release/mol_engine_core.dll
          python tests/python_headless.py target/release/mol_engine_core.dll
          powershell -ExecutionPolicy Bypass -File scripts/test-bridge.ps1
      - name: Shared library ABI smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          python tests/dll_smoke.py target/release/libmol_engine_core.so
          python tests/python_headless.py target/release/libmol_engine_core.so
          cc -std=c11 -Wall -Wextra -Werror -I include -c tests/c_layout.c -o target/c-layout.o
      - name: Shared library ABI smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          python tests/dll_smoke.py target/release/libmol_engine_core.dylib
          python tests/python_headless.py target/release/libmol_engine_core.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ runner.os }}
          path: |
            target/release/mol_engine_core.dll
            target/release/libmol_engine_core.so
            target/release/libmol_engine_core.dylib
            include/mol_engine_core.h
            TerraMol.exe
            artifacts/release/TerraMol-Viewer-*.zip
            artifacts/release/VIEWER-SHA256SUMS.txt
  lammps:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned serial LAMMPS
        run: |
          git clone --depth 1 --branch stable_29Aug2024_update3 https://github.com/lammps/lammps.git artifacts/lammps-source
          cmake -S artifacts/lammps-source/cmake -B artifacts/lammps-ci -D BUILD_SHARED_LIBS=ON -D BUILD_MPI=OFF -D BUILD_OMP=OFF -D CMAKE_BUILD_TYPE=Release -D CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build artifacts/lammps-ci --config Release --target lammps --parallel 2
      - name: Check installed header (Linux)
        if: runner.os == 'Linux'
        run: c++ -std=c++17 -Wall -Wextra -Werror -I artifacts/lammps-source/src -c tests/lammps_header_check.cpp -o artifacts/header-check.o
      - name: Select runtime
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "LAMMPS_LIBRARY=$GITHUB_WORKSPACE/artifacts/lammps-ci/Release/liblammps.dll" >> "$GITHUB_ENV"
          else
            echo "LAMMPS_LIBRARY=$GITHUB_WORKSPACE/artifacts/lammps-ci/liblammps.so" >> "$GITHUB_ENV"
          fi
      - name: Physical integration and error conversion
        run: |
          cargo test --features lammps --test lammps -- --ignored --test-threads=1
          cargo test --features lammps --lib -- --ignored --test-threads=1
          cargo run --features lammps --example lammps_lj
      - name: LJ viewer (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --features viewer,lammps --bin terramol_viewer
          python tests/viewer_smoke.py target/release/terramol_viewer --lammps
      - name: Full portable viewer and corresponding sources (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item -LiteralPath $env:LAMMPS_LIBRARY -Destination liblammps.dll
          powershell -ExecutionPolicy Bypass -File scripts/build-viewer.ps1
          python tests/viewer_smoke.py TerraMol.exe --lammps
          python scripts/package-viewer.py --with-lammps
          python scripts/package-source.py artifacts/lammps-source
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: viewer-with-lammps-Windows
          path: |
            artifacts/release/TerraMol-Viewer-*-LAMMPS.zip
            artifacts/release/VIEWER-LAMMPS-SHA256SUMS.txt
            artifacts/release/TerraMol-*-corresponding-source.tar.gz
