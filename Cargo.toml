[package]
name = "mol_engine_core"
version = "1.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "TerraMol: a Rust-owned molecular simulation core with a versioned C ABI"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
lammps = ["dep:libloading"]
viewer = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "terramol_viewer"
path = "src/bin/terramol_viewer.rs"
required-features = ["viewer"]

[dependencies]
libloading = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[profile.release]
panic = "unwind"

